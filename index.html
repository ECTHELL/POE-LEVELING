<meta charset="utf-8">
<title>PoE Başlangıç: ACT'ler</title>
<style>
  :root{
    --bg:#0d0d10;
    --panel:#16161c;
    --panel2:#1d1d25;
    --border:#2a2a35;
    --text:#e7e3d6;
    --muted:#8b8778;
    --gold:#c8aa6e;
    --gold-dim:#7a6a45;
    --done:#3a4a34;
    --done-text:#7fae6a;
    --now:#3a2f14;
    --now-border:#c8aa6e;
    --accent:#4a9fd4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Roboto,system-ui,sans-serif;
    font-size:var(--fs,15px);
    line-height:1.4;
    -webkit-user-select:none;
    user-select:none;
  }
  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,#15151b 0%,#111116 100%);
    border-bottom:1px solid var(--border);
    padding:10px 14px;
    box-shadow:0 4px 12px rgba(0,0,0,.5);
  }
  .htop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{
    margin:0;font-size:1.15em;font-weight:700;letter-spacing:.5px;
    color:var(--gold);white-space:nowrap;
  }
  h1 span{color:var(--muted);font-weight:400;font-size:.75em}
  .bar-wrap{flex:1;min-width:140px}
  .bar{
    height:14px;background:#000;border:1px solid var(--border);
    border-radius:8px;overflow:hidden;position:relative;
  }
  .bar>i{
    display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--gold-dim),var(--gold));
    transition:width .25s ease;
  }
  .bar-lbl{font-size:.75em;color:var(--muted);text-align:right;margin-top:2px}
  .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  button{
    background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:5px 10px;font-size:.82em;cursor:pointer;
    font-family:inherit;transition:.15s;white-space:nowrap;
  }
  button:hover{border-color:var(--gold-dim);background:#26262f}
  button.primary{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:600}
  button.primary:hover{background:#d8ba7e}
  button.danger:hover{border-color:#a44;color:#f0a0a0}
  #search{
    background:#000;border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:5px 10px;font-size:.85em;font-family:inherit;
    flex:1;min-width:120px;
  }
  #search:focus{outline:none;border-color:var(--gold-dim)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:.72em;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .legend .lg-v{background:#14231f;border-left:3px solid #4fb87a}
  .legend .lg-g{background:#1f1630;border-left:3px solid #a06cd4}
  .legend .lg-n{background:var(--now);border:1px solid var(--now-border)}
  /* ---------- Timer çubuğu ---------- */
  #timerbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:9px;padding:9px 11px;border-radius:9px;
    background:linear-gradient(180deg,#1c1a10,#141208);
    border:1px solid var(--gold-dim);
  }
  #tbtn{min-width:120px}
  #tbtn.running{background:#c0533a;border-color:#c0533a;color:#fff}
  .tinfo{flex:1;min-width:150px}
  .tnow{font-size:.82em;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tprog{height:8px;background:#000;border:1px solid var(--border);border-radius:5px;overflow:hidden;margin-top:4px}
  .tprog>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e0a94a,#f0d080);transition:width 1s linear}
  .tprog.low>i{background:linear-gradient(90deg,#c0533a,#e08050)}
  .tcount{font-size:1.5em;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);min-width:74px;text-align:center}
  .tcount.low{color:#f0876a;animation:pulse 1s infinite}
  .tempo{display:flex;align-items:center;gap:3px;font-size:.75em;color:var(--muted)}
  .tempo button{padding:4px 8px}
  .tempo button.on{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
  #tgt{width:70px;background:#000;border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:8px 6px;font-size:1em;font-family:inherit;text-align:center}
  #tgt:focus{outline:none;border-color:var(--gold-dim)}
  #tgtbtn{background:#241d0f;border-color:var(--gold-dim);color:var(--gold);font-weight:600}
  #tgtbtn:hover{background:#2e2612}
  #langbtn{background:#12212b;border-color:#33546b;color:#8fc4e6;font-weight:600;white-space:nowrap}
  #langbtn:hover{background:#17303e;border-color:#4a9fd4}
  /* ---------- Hedef seçim ekranı ---------- */
  .overlay{
    position:fixed;inset:0;z-index:200;
    background:rgba(6,6,9,.86);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:18px;
  }
  .overlay.hidden{display:none}
  .picker{
    background:linear-gradient(180deg,#17171d,#101015);
    border:1px solid var(--gold-dim);border-radius:14px;
    max-width:560px;width:100%;max-height:90vh;overflow:auto;
    padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.7);
  }
  .picker h2{margin:0 0 4px;color:var(--gold);font-size:1.3em;text-align:center}
  .picker .sub{margin:0 0 16px;color:var(--muted);font-size:.85em;text-align:center}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .pcard{
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:12px 10px;cursor:pointer;text-align:center;transition:.15s;
  }
  .pcard:hover{border-color:var(--gold);background:#26262f;transform:translateY(-2px)}
  .pcard.on{border-color:var(--gold);background:#241d0f;box-shadow:0 0 0 1px var(--gold)}
  .pcard .ph{font-size:1.5em;font-weight:700;color:var(--text)}
  .pcard .pd{font-size:.78em;color:var(--muted);margin-top:3px}
  .pcard.rec{border-color:var(--gold-dim)}
  .pcard.rec .ph{color:var(--gold)}
  .prec{display:inline-block;font-size:.62em;background:var(--gold);color:#1a1408;
    font-weight:700;padding:1px 6px;border-radius:10px;margin-top:5px;letter-spacing:.5px}
  .pcustom{display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:16px;flex-wrap:wrap;color:var(--muted);font-size:.85em}
  .pclose{display:block;margin:16px auto 0}
  .teta{font-size:.75em;color:var(--muted);white-space:nowrap}
  .teta b{color:var(--gold)}
  .tover{font-size:.82em;color:#f0a85a;white-space:nowrap;font-weight:600}
  .tover b{color:#ffb347;font-variant-numeric:tabular-nums}
  .tovertot{font-size:.75em;color:#c98a4a;white-space:nowrap}
  .tovertot b{color:#ff9a3c;font-variant-numeric:tabular-nums}
  .tovertot.ahead{color:#6bbf80}
  .tovertot.ahead b{color:#5fd08a}
  .tovertot:empty{display:none}
  /* süre etiketi (her adımda) */
  .est{
    align-self:center;flex:none;font-size:.7em;color:var(--muted);
    font-variant-numeric:tabular-nums;background:#000;border:1px solid var(--border);
    border-radius:20px;padding:1px 7px;white-space:nowrap;
  }
  .step.now .est{color:var(--gold);border-color:var(--gold-dim)}
  .editbtn{align-self:center;flex:none;background:transparent;border:none;cursor:pointer;font-size:.9em;opacity:0;padding:2px 4px;transition:.15s;line-height:1}
  .step:hover .editbtn{opacity:.5}
  .editbtn:hover{opacity:1;background:transparent}
  .txt.editing{outline:1px solid var(--gold);background:#000;border-radius:4px;padding:2px 6px;cursor:text;white-space:normal}
  /* ---------- Acts ---------- */
  main{padding:8px 12px 60px}
  .act{
    background:var(--panel);border:1px solid var(--border);
    border-radius:10px;margin:10px 0;overflow:hidden;
  }
  .act-head{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;cursor:pointer;background:var(--panel2);
    position:sticky;top:0;
  }
  .act-head:hover{background:#24242e}
  .caret{color:var(--gold);transition:transform .2s;font-size:.8em;width:12px}
  .act.collapsed .caret{transform:rotate(-90deg)}
  .act-title{font-weight:700;color:var(--gold);flex:1;font-size:1.02em}
  .act-prog{font-size:.78em;color:var(--muted);white-space:nowrap}
  .act-minibar{width:70px;height:6px;background:#000;border-radius:4px;overflow:hidden}
  .act-minibar>i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
  .act.collapsed .steps{display:none}
  .steps{padding:4px 6px 8px}
  /* ---------- Steps ---------- */
  .step{
    display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;
    padding:8px 10px;border-radius:7px;margin:2px 0;
    cursor:pointer;transition:.12s;border:1px solid transparent;
  }
  .step:hover{background:var(--panel2)}
  .step .box{
    flex:none;width:20px;height:20px;border:2px solid var(--gold-dim);
    border-radius:5px;margin-top:1px;display:flex;align-items:center;
    justify-content:center;font-size:14px;color:transparent;transition:.12s;
  }
  .step .num{color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.4em;text-align:right}
  .step .txt{flex:1}
  /* Sadece MEVCUT görev parlak; diğer TÜM görevler (yapılmış + yapılmamış) soluk */
  .step:not(.now){opacity:.38}
  .step:not(.now):hover{opacity:1}     /* üstüne gelince okunur olsun */
  .step:focus-within{opacity:1}        /* gem eklerken (input odakta) parlak kalsın */
  .step.done .box{background:var(--done);border-color:var(--done);color:var(--done-text)}
  .step.now{
    opacity:1;
    background:var(--now);border-color:var(--now-border);
    box-shadow:0 0 0 1px var(--now-border),0 0 16px rgba(200,170,110,.22);
  }
  .step.now .txt{font-weight:600;color:#fff}
  .step.now .num{color:var(--gold)}
  .step.now::after{
    content:"◀ ŞU AN";color:var(--gold);font-size:.72em;font-weight:700;
    align-self:center;letter-spacing:.5px;animation:pulse 1.6s infinite;
  }
  :root[lang="en"] .step.now::after{content:"◀ NOW"}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .step.hidden{display:none}
  /* ---------- Satıcı adımları ---------- */
  .step.vendor{
    background:#14231f;
    border-left:4px solid #4fb87a;
    padding-left:8px;
  }
  .step.vendor:hover{background:#193026}
  .step.vendor .box{border-color:#4fb87a}
  .step.vendor.done{background:transparent;border-left-color:#2e5c44}
  .vbadge{
    align-self:center;flex:none;
    background:#1d5c3a;color:#a9f0c6;
    font-size:.68em;font-weight:700;letter-spacing:.5px;
    padding:2px 7px;border-radius:20px;border:1px solid #4fb87a;
    white-space:nowrap;
  }
  .step.done .vbadge{opacity:.5}
  /* ---------- Gem alışveriş adımları ---------- */
  .step.gem{
    background:#1f1630;
    border-left:4px solid #a06cd4;
    padding-left:8px;
    align-items:center;
  }
  .step.gem:hover{background:#281d3d}
  .step.gem .box{border-color:#a06cd4}
  .step.gem.done{background:transparent;border-left-color:#5a3f7a}
  .step.gem .txt{font-size:.92em}
  .step.gem .txt b{color:#e0c6f0}
  .step.gem.done .box{background:#4a2f6e;border-color:#4a2f6e;color:#d9b8f0}
  .gbadge{
    align-self:flex-start;flex:none;margin-top:2px;
    background:#3a2359;color:#e6ccf5;
    font-size:.66em;font-weight:700;letter-spacing:.5px;
    padding:3px 8px;border-radius:20px;border:1px solid #a06cd4;
    white-space:nowrap;
  }
  .step.gem .num{color:#a06cd4}
  .step.done .gbadge{opacity:.5}
  /* ---------- Kullanıcının gem alışveriş listesi ---------- */
  .gembox{flex-basis:100%;margin-top:8px;padding-top:8px;border-top:1px dashed #4a3a63}
  .usergems-lbl{font-size:.72em;color:#c89be0;margin-bottom:5px;font-weight:600}
  .usergems{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
  .usergems:empty{display:none}
  .gemchip{background:#2a2340;border:1px solid #a06cd4;color:#efe0f8;border-radius:20px;
    padding:3px 5px 3px 10px;font-size:.84em;display:inline-flex;align-items:center;gap:7px;font-weight:600}
  .gemchip b{cursor:pointer;color:#c89be0;font-weight:700;padding:0 3px;border-radius:10px}
  .gemchip b:hover{color:#fff;background:#5a3f7a}
  .gemadd{display:flex;gap:6px;flex-wrap:wrap}
  .geminput{background:#000;border:1px solid var(--border);color:var(--text);border-radius:6px;
    padding:5px 9px;font-size:.85em;font-family:inherit;min-width:150px;flex:1}
  .geminput:focus{outline:none;border-color:#a06cd4}
  .gemadd button{background:#3a2359;border-color:#a06cd4;color:#efe0f8;font-weight:600}
  .gemadd button:hover{background:#4a2f6e}
  /* ---------- Pasif adımı (görev listesi içinde) ---------- */
  .step.passive{background:#122016;border-left:4px solid #4fa15a;padding-left:8px;align-items:center}
  .step.passive:hover{background:#17301f}
  .step.passive .box{border-color:#4fa15a}
  .step.passive.done .box{background:#2f5c37;border-color:#2f5c37;color:#9fe0a8}
  .step.passive .num{color:#8fd48f}
  .passbadge{align-self:center;flex:none;background:#1d4a28;color:#bfe8c6;font-size:.66em;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:20px;border:1px solid #4fa15a;white-space:nowrap}
  .step.done .passbadge{opacity:.5}
  .gembox.pass{border-top-color:#2f5c37}
  .gembox.pass .usergems-lbl{color:#8fd48f}
  .gembox.pass .gemchip{background:#14281a;border-color:#4fa15a;color:#dff5e2}
  .gembox.pass .gemchip b{color:#8fd48f}
  .gembox.pass .gemchip b:hover{background:#2f5c37}
  .gembox.pass .geminput:focus{border-color:#4fa15a}
  .gembox.pass .gemadd button{background:#1d4a28;border-color:#4fa15a}
  .gembox.pass .gemadd button:hover{background:#26602f}
  /* Pasif bilgilendirme bloğu (görev değil, görevler arası) */
  .passinfo{background:linear-gradient(180deg,#12241a,#0f1d15);border:1px solid #2f5c37;border-left:4px solid #4fa15a;border-radius:9px;margin:8px 4px;padding:10px 12px;box-shadow:0 0 12px rgba(79,161,90,.10)}
  .passinfo-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .passinfo-txt{color:#cdeecf;font-weight:600;font-size:.9em}
  /* ---------- (eski) Pasif Ağaç Planı paneli — artık kullanılmıyor ---------- */
  #passive{margin:12px 12px 70px;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .pass-head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:var(--panel2)}
  .pass-head:hover{background:#24242e}
  .pass-head .caret{color:#6fbf73;transition:transform .2s;font-size:.8em;width:12px}
  #passive.collapsed .pass-body{display:none}
  #passive.collapsed .caret{transform:rotate(-90deg)}
  .pass-title{font-weight:700;color:#8fd48f;flex:1}
  .pass-prog{font-size:.78em;color:var(--muted)}
  .pass-sub{font-size:.76em;color:var(--muted);padding:9px 14px 4px;line-height:1.5}
  .pass-body{padding:2px 8px 10px}
  .passrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;margin:3px 0;border:1px solid transparent}
  .passrow:hover{background:var(--panel2)}
  .passrow.done{opacity:.5}
  .passrow .box{flex:none;width:20px;height:20px;border:2px solid #4fa15a;border-radius:5px;display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer;font-size:14px}
  .passrow.done .box{background:#2f5c37;border-color:#2f5c37;color:#9fe0a8}
  .passlvl{flex:none;min-width:64px;font-weight:700;color:#8fd48f;background:#132218;border:1px solid #2f5c37;border-radius:20px;padding:3px 10px;text-align:center;font-size:.84em;cursor:pointer}
  .passgems{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:100%}
  .passgems:empty{display:none}
  .passchip{background:#14281a;border:1px solid #4fa15a;color:#dff5e2;border-radius:20px;padding:3px 5px 3px 10px;font-size:.84em;display:inline-flex;align-items:center;gap:7px;font-weight:600}
  .passchip b{cursor:pointer;color:#8fd48f;font-weight:700;padding:0 3px;border-radius:10px}
  .passchip b:hover{color:#fff;background:#2f5c37}
  .passadd{display:flex;gap:6px;flex:1;min-width:100%}
  .passinput{background:#000;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 9px;font-size:.85em;font-family:inherit;flex:1;min-width:150px}
  .passinput:focus{outline:none;border-color:#4fa15a}
  .passadd button{background:#1d4a28;border-color:#4fa15a;color:#dff5e2;font-weight:600}
  .passadd button:hover{background:#26602f}
  /* ---------- Notes ---------- */
  .note{
    margin:6px 8px;padding:9px 12px;border-radius:7px;
    background:#1a1508;border:1px solid var(--gold-dim);
    color:var(--gold);font-size:.88em;display:flex;gap:8px;align-items:flex-start;
  }
  .note .ic{flex:none}
  .note a{color:var(--accent)}
  b.hl{color:#f0d9a0}
  .empty{color:var(--muted);text-align:center;padding:30px;font-style:italic}
  footer{
    position:fixed;bottom:0;left:0;right:0;
    background:#0a0a0d;border-top:1px solid var(--border);
    padding:6px 12px;font-size:.75em;color:var(--muted);text-align:center;
  }
  /* scrollbar */
  ::-webkit-scrollbar{width:11px}
  ::-webkit-scrollbar-track{background:#0a0a0d}
  ::-webkit-scrollbar-thumb{background:#2e2e38;border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}
</style>

<header>
  <div class="htop">
    <h1><span id="ttl"></span> <span id="ov-count"></span></h1>
    <div class="bar-wrap">
      <div class="bar"><i id="ov-bar"></i></div>
      <div class="bar-lbl" id="ov-lbl">0%</div>
    </div>
    <button id="langbtn" onclick="toggleLang()" title="Language / Dil"></button>
  </div>
  <div class="controls">
    <button class="primary" id="btnGoNow" onclick="goNow()"></button>
    <input id="search" oninput="doSearch(this.value)">
    <button id="btnExpand" onclick="expandAll(true)"></button>
    <button id="btnCollapse" onclick="expandAll(false)"></button>
    <button onclick="fontSize(-1)">A−</button>
    <button onclick="fontSize(1)">A+</button>
    <button id="btnExport" onclick="exportBackup()"></button>
    <button id="btnImport" onclick="document.getElementById('bkfile').click()"></button>
    <input type="file" id="bkfile" accept=".json,application/json" style="display:none" onchange="importBackup(this)">
    <button class="danger" id="btnReset" onclick="resetAll()"></button>
  </div>
  <div class="legend">
    <span><i class="lg-v"></i> <span id="lgV"></span></span>
    <span><i class="lg-g"></i> <span id="lgG"></span></span>
    <span><i class="lg-n"></i> <span id="lgN"></span></span>
  </div>
  <div id="timerbar">
    <button id="tbtn" class="primary" onclick="toggleTimer()"></button>
    <div class="tinfo">
      <div class="tnow" id="tnow">—</div>
      <div class="tprog" id="tprog"><i id="tprogbar"></i></div>
    </div>
    <div class="tcount" id="tcount">--:--</div>
    <button id="btnAdd" onclick="addTime(30)"></button>
    <button id="btnSkip" onclick="skipCurrent()"></button>
    <button id="sndbtn" onclick="toggleSound()" title="Bildirim sesi aç/kapa">🔔</button>
    <button id="tgtbtn" onclick="openPicker()"></button>
    <div class="tover" id="tover" style="display:none"></div>
    <div class="tovertot" id="tovertot"></div>
    <div class="teta" id="teta"></div>
  </div>
</header>

<main id="app"></main>

<footer id="footer"></footer>

<div id="picker" class="overlay hidden">
  <div class="picker">
    <h2 id="pkTitle"></h2>
    <p class="sub" id="pkSub"></p>
    <div class="pgrid" id="pgrid"></div>
    <div class="pcustom">
      <span id="pkCustom"></span>
      <input id="tgt" type="number" min="90" max="1200" step="15">
      <span id="pkUnit"></span>
      <button id="pkApply" onclick="pickTarget(document.getElementById('tgt').value)"></button>
    </div>
    <button class="pclose" id="pkClose" onclick="closePicker()"></button>
  </div>
</div>

<datalist id="gemdb"></datalist>

<script>
/* ============ VERİ ============ */
const DATA = [

let targetMin=parseFloat(localStorage.getItem(KEY+"_target")||"270"); // hedef toplam süre (dk)
let tempo=1; // hedeften türetilir (aşağıda)
// Zorlu / act-sonu / uzun boss'lar (daha çok süre)
const HARD_BOSS=/(merveil|brutus|vaal oversoul|dominus|malachai|kitava|shavronne|tukohama|abberath|brine king|arakaali|kaom|daresso|izaro|depraved trinity|innocence öldür|avarius|ryslatha|garukhan|basilisk|dawn|dusk|lunaris ve solaris|solaris ve|piety öldür|weaver|fidelitas)/;
// Uzun / çok bölgeli haritalar (ekstra süre)
const LONG_MAP=/(sırayla|northern forest, caverns|belly of the beast|solaris temple|lunaris temple|temple of decay|ossuary|reliquary|crystal veins|mines level|vaal ruins|harvest)/;
function baseSec(t,ai,gem,vend){
  const s=t.toLowerCase();
  if(gem) return 90;                                   // alışveriş hatırlatması
  if(/pasif/.test(s)) return 40;                       // pasif planı işaretleme (hızlı)
  if(/aspirant/.test(s)) return /68 level/.test(s)?780:(/55 level/.test(s)?660:600); // TAM Ascendancy labirenti (Izaro x3): Merciless>Cruel>Normal
  if(/labirent/.test(s)) return 360;                   // kampanya trial'ı ~6dk
  if(HARD_BOSS.test(s)) return ai===0?300:240;         // zorlu boss (Act 1 daha uzun)
  if(/(öldür|\bkes\b|kesip|savaş)/.test(s)) return ai===0?210:170; // normal kesim
  if(vend||/şehre dön|şehre gir/.test(s)) return 75;   // şehir/satıcı
  if(LONG_MAP.test(s)||/3 tane|topla/.test(s)) return 190; // uzun/çok bölgeli
  return 150;                                          // normal geçiş
}
function stepSec(t,ai,gem,vend){return Math.max(20,Math.round(baseSec(t,ai,gem,vend)*tempo));}
function fmtDur(sec){const m=Math.floor(sec/60),s=sec%60;return m+":"+String(s).padStart(2,"0");}
// Tüm adımların tempo=1'deki toplam süresi (saniye)
function totalBaseSec(){
  let sum=0;
  DATA.forEach((act,ai)=>act.steps.forEach(raw=>{
    const isObj=typeof raw==="object";
    if(isObj&&raw.pass)return;                 // pasif bilgilendirme süreye girmez
    const t=isObj?raw.t:raw;
    const gem=isObj&&raw.gem;
    const vend=!gem&&/sat[iı]c/i.test(t);
    sum+=baseSec(t,ai,gem,vend);
  }));
  return sum;
}
// tempo'yu, tüm kampanya = targetMin olacak şekilde ayarla
function applyTarget(){ tempo=(targetMin*60)/totalBaseSec(); }
applyTarget();

function render(){

    const done=act.steps.filter((_,si)=>state[id(ai,si)]).length;
    const total=act.steps.length;
    const pct=Math.round(done/total*100);
    const isCol=collapsed[ai];
    const el=document.createElement("div");
    el.className="act"+(isCol?" collapsed":"");
    el.dataset.act=ai;
    el.innerHTML=`
      <div class="act-head" onclick="toggleAct(${ai})">
        <span class="caret">▼</span>
        <span class="act-title">${act.title}</span>
        <div class="act-minibar"><i style="width:${pct}%"></i></div>
        <span class="act-prog">${done}/${total}</span>
      </div>
      <div class="steps">
        ${(()=>{let n=0;return act.steps.map((raw,si)=>{
          const gem=gemOf(ai,si);
          const pass=passOf(ai,si)!=null;
          const trText=trOf(ai,si);             // süre & satıcı için Türkçe
          const disp=dispText(ai,si);           // görüntülenecek (düzenlenmişse o, yoksa dile göre)
          const d=state[id(ai,si)];
          const vend=!gem&&!pass&&/sat[iı]c/i.test(trText);
          const label=gem?"💎":(pass?"🌳":(++n));
          const cls=(d?" done":"")+(pass?" passive":(gem?" gem":(vend?" vendor":"")));
          const badge=pass?`<span class="passbadge">${T("passBadge")}</span>`
            :(gem?`<span class="gbadge">${T("gBadge")}</span>`:(vend?`<span class="vbadge">${T("vBadge")}</span>`:""));
          const dur=pass?5:stepSec(trText,ai,gem,vend);   // pasif = sabit 5 sn
          return `<div class="step${cls}" data-act="${ai}" data-step="${si}" data-est="${dur}" data-txt="${disp.toLowerCase().replace(/"/g,'')}" onclick="toggle(${ai},${si})">
            <span class="box">✔</span>
            <span class="num">${label}</span>
            <span class="txt">${disp}</span>
            ${badge}
            <span class="est">⏱ ${fmtDur(dur)}</span>
            <button class="editbtn" onclick="event.stopPropagation();editStep(${ai},${si},this)" title="${T("editHint")}">✏️</button>
            ${(gem||pass)?gemBoxHTML(ai,si,pass):""}
          </div>`;
        }).join("")})()}
        ${notesOf(ai).map(n=>`<div class="note"><span class="ic">📌</span><span>${n}</span></div>`).join("")}
      </div>`;
    app.appendChild(el);
  });
  updateOverall();
  markNow();
}

function updateOverall(){
  let done=0,total=0;
  DATA.forEach((act,ai)=>act.steps.forEach((_,si)=>{total++;if(state[id(ai,si)])done++;}));
  const pct=total?Math.round(done/total*100):0;
  document.getElementById("ov-bar").style.width=pct+"%";
  document.getElementById("ov-lbl").textContent=pct+"%";
  document.getElementById("ov-count").textContent=`(${done}/${total})`;
}

/* İlk tamamlanmamış adımı "ŞU AN" olarak işaretle */
function markNow(){
  document.querySelectorAll(".step.now").forEach(e=>e.classList.remove("now"));
  for(let ai=0;ai<DATA.length;ai++){
    for(let si=0;si<DATA[ai].steps.length;si++){
      if(!state[id(ai,si)]){
        const e=document.querySelector(`.step[data-act="${ai}"][data-step="${si}"]`);
        if(e)e.classList.add("now");
        return;
      }
    }
  }
}

/* ============ ACTIONS ============ */
// Bir adımın görsel durumunu (checkbox, act mini bar, genel bar, ŞU AN) güncelle
function applyDoneUI(ai,si){
  const stepEl=document.querySelector(`.step[data-act="${ai}"][data-step="${si}"]`);
  if(stepEl)stepEl.classList.toggle("done",!!state[id(ai,si)]);
  const act=DATA[ai];
  const done=act.steps.filter((_,s)=>state[id(ai,s)]).length;
  const actEl=document.querySelector(`.act[data-act="${ai}"]`);
  if(actEl){
    actEl.querySelector(".act-minibar>i").style.width=Math.round(done/act.steps.length*100)+"%";
    actEl.querySelector(".act-prog").textContent=`${done}/${act.steps.length}`;
  }
  updateOverall();
  markNow();
}
let editingNow=false;
function toggle(ai,si){
  if(editingNow)return;             // metin düzenlenirken tıklama görevi tamamlamasın
  state[id(ai,si)]=!state[id(ai,si)];
  save();
  applyDoneUI(ai,si);
  syncTimer();      // şu anki görev değişmiş olabilir → timer'ı hizala
}
// Görev metnini yerinde düzenle (tarayıcıya kaydedilir)
function editStep(a,s,btn){
  const stepEl=btn.closest(".step");
  const txtEl=stepEl.querySelector(".txt");
  editingNow=true;
  txtEl.setAttribute("contenteditable","true");
  txtEl.classList.add("editing");
  txtEl.focus();
  const range=document.createRange();range.selectNodeContents(txtEl);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
  const finish=(save)=>{
    txtEl.removeEventListener("keydown",onKey);
    txtEl.removeEventListener("blur",onBlur);
    txtEl.removeAttribute("contenteditable");
    txtEl.classList.remove("editing");
    if(save){
      const val=(txtEl.innerText||"").replace(/\s+/g," ").trim();
      const k=lang+"|"+id(a,s);
      if(val && val!==txtOf(a,s)) textOverrides[k]=val;   // farklıysa kaydet
      else delete textOverrides[k];                        // orijinale döndüyse override'ı sil
      saveTextOverrides();
    }
    editingNow=false;
    render();   // metni (ve arama/etiket) tazele
  };
  const onKey=(e)=>{ if(e.key==="Enter"){e.preventDefault();finish(true);} else if(e.key==="Escape"){e.preventDefault();finish(false);} };
  const onBlur=()=>finish(true);
  txtEl.addEventListener("keydown",onKey);
  txtEl.addEventListener("blur",onBlur);
}
function toggleAct(ai){
  collapsed[ai]=!collapsed[ai];
  saveCol();
  document.querySelector(`.act[data-act="${ai}"]`).classList.toggle("collapsed",collapsed[ai]);
}
function expandAll(open){
  DATA.forEach((_,ai)=>collapsed[ai]=!open);
  saveCol();render();
  if(typeof refreshTimerUI==="function")refreshTimerUI();
}
function resetAll(){
  if(confirm(T("resetConfirm"))){
    state={};save();render();
    stopTimer();stopOverrun();totalOverrun=0;saveOverTotal();updateOverTotal();remaining=0;curSel=null;syncTimer();
  }
}
/* ---- YEDEKLE / GERİ YÜKLE (dışa-içe aktar) — ileride kaldırılabilir ---- */
function exportBackup(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf("poe_guide")===0)data[k]=localStorage.getItem(k);}
  const blob=new Blob([JSON.stringify({app:"poe-leveling",ts:Date.now(),data},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  a.download=`poe-rehberi-yedek-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importBackup(input){
  const f=input.files&&input.files[0]; if(!f){return;}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      const data=(obj&&obj.data&&typeof obj.data==="object")?obj.data:obj;
      if(!data||typeof data!=="object")throw 0;
      if(!confirm(T("importConfirm"))){input.value="";return;}
      Object.keys(data).forEach(k=>{ if(k.indexOf("poe_guide")===0) localStorage.setItem(k,data[k]); });
      location.reload();
    }catch(e){ alert(T("importError")); input.value=""; }
  };
  r.readAsText(f);
}
function goNow(){
  const el=document.querySelector(".step.now");
  if(el){
    const act=el.closest(".act");
    if(act.classList.contains("collapsed")){toggleAct(+act.dataset.act);}
    el.scrollIntoView({behavior:"smooth",block:"center"});
  }else{alert(T("allDone"));}
}
function doSearch(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll(".act").forEach(act=>{
    let anyVisible=false;
    act.querySelectorAll(".step").forEach(s=>{
      const match=!q||s.dataset.txt.includes(q);
      s.classList.toggle("hidden",!match);
      if(match)anyVisible=true;
    });
    act.style.display=(q&&!anyVisible)?"none":"";
    if(q)act.classList.remove("collapsed"); // arama sırasında hepsini aç
  });
  if(!q){ // arama bitince eski katlanmış hali geri getir
    document.querySelectorAll(".act").forEach(act=>{
      act.classList.toggle("collapsed",!!collapsed[+act.dataset.act]);
    });
  }
}
/* Font boyutu */
let fs=parseInt(localStorage.getItem(KEY+"_fs")||"15");
function applyFs(){document.documentElement.style.setProperty("--fs",fs+"px")}
function fontSize(d){fs=Math.max(11,Math.min(24,fs+d));localStorage.setItem(KEY+"_fs",fs);applyFs()}
applyFs();

/* ============ OTOMATİK TIMER ============ */
let running=false, remaining=0, tHandle=null, curSel=null, endAt=0;
// endAt: sayaç sıfırlanacağı duvar-saati anı (arka planda sapmayı önler)
function arm(){ endAt=Date.now()+remaining*1000; }
// Timer durumunu kaydet (sayfa yenilense de devam etsin)
function saveTimer(){try{localStorage.setItem(KEY+"_tmr",JSON.stringify({r:running,rem:Math.max(0,Math.round(remaining))}));}catch(e){}}

/* ---- UZAMA SAYACI (duraklatınca: bu görev ne kadar uzadı?) — ileride kaldırılabilir ---- */
let overStart=0, overHandle=null;
function startOverrun(from){
  overStart=from||Date.now();
  try{localStorage.setItem(KEY+"_overstart",overStart);}catch(e){}   // yenilemede kaybolmasın
  const el=document.getElementById("tover"); if(el)el.style.display="";
  clearInterval(overHandle); overHandle=setInterval(updateOverrun,250); updateOverrun();
}
function stopOverrun(){
  clearInterval(overHandle); overHandle=null; overStart=0;
  try{localStorage.removeItem(KEY+"_overstart");}catch(e){}
  const el=document.getElementById("tover"); if(el)el.style.display="none";
}
function updateOverrun(){
  const el=document.getElementById("tover"); if(!el||!overStart)return;
  el.innerHTML=`${T("overrun")} <b>+${fmtDur(Math.floor((Date.now()-overStart)/1000))}</b>`;
}
// Toplam uzama (tüm duraklamaların toplamı = hedeften sapma)
let totalOverrun=parseInt(localStorage.getItem(KEY+"_overtot")||"0")||0;
function saveOverTotal(){localStorage.setItem(KEY+"_overtot",totalOverrun);}
function updateOverTotal(){
  const el=document.getElementById("tovertot"); if(!el)return;
  if(!totalOverrun){ el.innerHTML=""; el.classList.remove("ahead"); return; }
  const sign = totalOverrun>0 ? "+" : "−";
  el.classList.toggle("ahead", totalOverrun<0);   // negatif = öne geçti (yeşil)
  el.innerHTML=`${T("overTotal")} <b>${sign}${fmtDur(Math.abs(totalOverrun))}</b>`;
}
function bankOverrun(){   // devam edince: bu duraklamanın süresini toplama ekle
  if(overStart){ totalOverrun+=Math.max(0,Math.floor((Date.now()-overStart)/1000)); saveOverTotal(); updateOverTotal(); }
}

/* ---- Bildirim sesleri (Web Audio, dosyasız) ---- */
let soundOn=localStorage.getItem(KEY+"_sound")!=="0", audioCtx=null;
function ensureAudio(){
  try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  if(audioCtx&&audioCtx.state==="suspended") audioCtx.resume();
}
function tone(freq,startT,dur,type,gain){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  o.connect(g); g.connect(audioCtx.destination);
  const t0=audioCtx.currentTime+startT;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(gain||0.25,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.start(t0); o.stop(t0+dur+0.03);
}
function playSound(kind){
  if(!soundOn)return;
  ensureAudio(); if(!audioCtx)return;
  if(kind==="skill"){                 // 💎 gem/skill adımı: yükselen 3 notalı çınlama
    tone(587.33,0,0.16,"triangle",0.32);   // D5
    tone(880.00,0.14,0.16,"triangle",0.32); // A5
    tone(1174.66,0.28,0.26,"triangle",0.34);// D6
  }else if(kind==="pass"){            // 🌳 pasif hatırlatıcı: alçalan yumuşak çift nota
    tone(523.25,0,0.18,"sine",0.26);       // C5
    tone(392.00,0.16,0.34,"sine",0.26);    // G4
  }else{                              // normal görev: kısa iki notalı "ding"
    tone(880,0,0.12,"sine",0.28);          // A5
    tone(1318.51,0.10,0.20,"sine",0.28);   // E6
  }
}
function toggleSound(){
  soundOn=!soundOn;
  localStorage.setItem(KEY+"_sound",soundOn?"1":"0");
  const b=document.getElementById("sndbtn");
  if(b)b.textContent=soundOn?"🔔":"🔕";
  if(soundOn){ensureAudio();playSound("task");}  // açınca örnek ses
}

// İlk tamamlanmamış adım {ai,si,el,dur}
function currentStep(){
  for(let ai=0;ai<DATA.length;ai++){
    for(let si=0;si<DATA[ai].steps.length;si++){
      if(!state[id(ai,si)]){
        const el=document.querySelector(`.step[data-act="${ai}"][data-step="${si}"]`);
        const dur=el?(+el.dataset.est||stepSec(trOf(ai,si),ai,false,false)):150;
        return {ai,si,el,dur};
      }
    }
  }
  return null;
}
function fmtLong(sec){const h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);return h?`${h}s ${m}dk`:`${m} dk`;}
// Kalan tüm görevlerin toplam süresi
function totalETA(){
  let sum=0;
  document.querySelectorAll(".step:not(.done)").forEach(e=>sum+=(+e.dataset.est||0));
  return sum;
}
function scrollToCurrent(cur){
  if(!cur||!cur.el)return;
  const act=cur.el.closest(".act");
  if(act&&act.classList.contains("collapsed"))toggleAct(+act.dataset.act);
  cur.el.scrollIntoView({behavior:"smooth",block:"center"});
}
function refreshTimerUI(){
  const cur=currentStep();
  const tnow=document.getElementById("tnow");
  const tcount=document.getElementById("tcount");
  const tprog=document.getElementById("tprog");
  const bar=document.getElementById("tprogbar");
  const eta=document.getElementById("teta");
  if(!cur){
    tnow.textContent=T("allDone");
    tcount.textContent="--:--";tcount.classList.remove("low");
    tprog.classList.remove("low");bar.style.width="0%";
    eta.innerHTML="";stopTimer();return;
  }
  const txt=dispText(cur.ai,cur.si).replace(/<[^>]+>/g,"");
  tnow.innerHTML=`<b style="color:#f0d9a0">${DATA[cur.ai].title}</b> · ${txt}`;
  if(!running && remaining<=0) remaining=cur.dur;
  tcount.textContent=fmtDur(remaining);
  const low=remaining<=15;
  tcount.classList.toggle("low",low);
  tprog.classList.toggle("low",low);
  bar.style.width=Math.max(0,Math.min(100,remaining/cur.dur*100))+"%";
  eta.innerHTML=`${T("eta")}<b>${fmtLong(totalETA())}</b>`;
  saveTimer();
}
function startTimer(){
  const cur=currentStep();
  if(!cur){refreshTimerUI();return;}
  if(remaining<=0)remaining=cur.dur;
  running=true;
  ensureAudio();          // kullanıcı tıklamasıyla sesi hazırla
  arm();
  const btn=document.getElementById("tbtn");
  btn.textContent=T("pause");btn.classList.add("running");
  scrollToCurrent(cur);
  clearInterval(tHandle);
  tHandle=setInterval(tick,1000);
  refreshTimerUI();
}
function stopTimer(){
  if(running) remaining=Math.max(0,Math.round((endAt-Date.now())/1000)); // duraklarken kalanı sabitle
  running=false;clearInterval(tHandle);tHandle=null;
  const btn=document.getElementById("tbtn");
  if(btn){btn.textContent=T("autoStart");btn.classList.remove("running");}
  saveTimer();
}
function toggleTimer(){
  if(running){ stopTimer(); startOverrun(); refreshTimerUI(); }  // duraklat → uzama sayacı başlar
  else { bankOverrun(); stopOverrun(); startTimer(); }          // devam et → süreyi toplama ekle, sayacı durdur
}
function tick(){
  // Kalanı duvar-saatinden hesapla (arka planda throttle olsa da doğru kalır)
  remaining=Math.max(0,Math.round((endAt-Date.now())/1000));
  if(endAt-Date.now()<=0){ completeCurrent(); return; }
  refreshTimerUI();
}
// Süre doldu (veya Atla): şu anki görevi tamamla ve sonrakine geç
function completeCurrent(fromSkip){
  const cur=currentStep();
  if(!cur){stopTimer();refreshTimerUI();return;}
  if(fromSkip){   // erken atlandı → kalan süreyi toplam sapmadan düş (öne geçme)
    const leftover = running ? Math.max(0,(endAt-Date.now())/1000) : Math.max(0,remaining);
    if(leftover>=1){ totalOverrun-=Math.round(leftover); saveOverTotal(); updateOverTotal(); }
  }
  state[id(cur.ai,cur.si)]=true;
  save();
  applyDoneUI(cur.ai,cur.si);
  const next=currentStep();
  remaining=next?next.dur:0;
  arm();
  if(next && (running||fromSkip)){
    // sıradaki adım pasif mi / gem mi / normal mi → sese göre
    const kind = passOf(next.ai,next.si)!=null ? "pass" : (gemOf(next.ai,next.si)?"skill":"task");
    playSound(kind);
    scrollToCurrent(next);
  }
  refreshTimerUI();
  if(!next) stopTimer();
}
// Manuel işaretleme sonrası timer'ı hizala (şu anki görev değiştiyse süreyi sıfırla)
function syncTimer(){
  const cur=currentStep();
  const key=cur?id(cur.ai,cur.si):null;
  if(key!==curSel){ curSel=key; remaining=cur?cur.dur:0; if(running)arm(); }
  refreshTimerUI();
}
function skipCurrent(){ completeCurrent(true); }
function addTime(s){ remaining+=s; if(running)endAt+=s*1000; totalOverrun+=s; saveOverTotal(); updateOverTotal(); refreshTimerUI(); }
const TARGETS=[180,210,240,270,300,360,420];
function fmtHours(min){const h=min/60,n=(Number.isInteger(h)?h:h.toFixed(1));return lang==="en"?n+"h":n+" "+T("hours");}
function buildPicker(){
  const grid=document.getElementById("pgrid");if(!grid)return;
  const d=UI[lang].descs;
  grid.innerHTML=TARGETS.map((t,i)=>`<div class="pcard${t===270?' rec':''}${t===targetMin?' on':''}" data-t="${t}" onclick="pickTarget(${t})"><div class="ph">${fmtHours(t)}</div><div class="pd">${d[i]}</div>${t===270?`<div class="prec">${T("recommended")}</div>`:""}</div>`).join("");
}
function applyLang(){
  document.documentElement.lang=lang;
  const S=(el,v)=>{const e=document.getElementById(el);if(e)e.textContent=v;};
  S("ttl",T("title"));
  const lb=document.getElementById("langbtn");if(lb)lb.textContent=lang==="tr"?"🌐 English":"🌐 Türkçe";
  S("btnGoNow",T("goNow"));
  const se=document.getElementById("search");if(se)se.placeholder=T("search");
  S("btnExpand",T("expand"));S("btnCollapse",T("collapse"));S("btnReset",T("reset"));
  S("btnExport",T("backupExport"));S("btnImport",T("backupImport"));
  S("lgV",T("legendV"));S("lgG",T("legendG"));S("lgN",T("legendN"));
  S("btnAdd",T("addTime"));S("btnSkip",T("skip"));
  S("tbtn",running?T("pause"):T("autoStart"));
  const tb=document.getElementById("tgtbtn");if(tb)tb.textContent=T("target")+fmtHours(targetMin);
  const ft=document.getElementById("footer");if(ft)ft.innerHTML=T("footer");
  S("pkTitle",T("pickTitle"));S("pkSub",T("pickSub"));
  S("pkCustom",T("custom"));S("pkUnit",T("unit"));S("pkApply",T("apply"));S("pkClose",T("close"));
  buildPicker();
}
function toggleLang(){
  lang=lang==="tr"?"en":"tr";
  localStorage.setItem("poe_guide_lang",lang);
  applyLang();render();refreshTimerUI();
}
function setTarget(min){
  min=Math.max(90,Math.min(1200,Math.round(+min)||270));
  targetMin=min;localStorage.setItem(KEY+"_target",min);
  applyTarget();            // tempo yeniden hesaplanır
  const btn=document.getElementById("tgtbtn");if(btn)btn.textContent=T("target")+fmtHours(min);
  buildPicker();
  render();                 // süre etiketleri & data-est yeniden hesaplanır
  const cur=currentStep();
  remaining=cur?cur.dur:0;  // yeni sürelere göre sıfırla
  curSel=cur?id(cur.ai,cur.si):null;
  if(running)arm();
  refreshTimerUI();
}
function openPicker(){document.getElementById("picker").classList.remove("hidden");}
function closePicker(){document.getElementById("picker").classList.add("hidden");}
function pickTarget(min){ if(!min&&min!==0)return; setTarget(min); closePicker(); }

const firstTime=localStorage.getItem(KEY+"_target")===null;
render();
applyLang();   // tüm statik arayüz metinlerini + picker'ı dile göre doldur
buildGemDatalist();   // dropdown gem veritabanını doldur
// timer durumunu geri yükle (sayfa yenilense de devam etsin)
const savedTmr=JSON.parse(localStorage.getItem(KEY+"_tmr")||"null");
const savedOverStart=parseInt(localStorage.getItem(KEY+"_overstart")||"0")||0;
{const c=currentStep();curSel=c?id(c.ai,c.si):null;remaining=(savedTmr&&savedTmr.rem>0)?savedTmr.rem:(c?c.dur:0);}
if(savedTmr&&savedTmr.r&&currentStep()){ stopOverrun(); startTimer(); }  // çalışıyordu → kaldığı yerden devam
else { refreshTimerUI(); if(savedOverStart) startOverrun(savedOverStart); }  // duraklamışsa uzama kaldığı yerden sürsün
// ses düğmesi başlangıç durumu + kayıtlı toplam sapma
{const sb=document.getElementById("sndbtn");if(sb)sb.textContent=soundOn?"🔔":"🔕";}
updateOverTotal();
// sekme tekrar görünür olunca sayacı anında senkronla (arka plan throttle sonrası)
document.addEventListener("visibilitychange",()=>{ if(running&&!document.hidden)tick(); });
// ilk açılışta (hedef henüz seçilmemişse) seçim ekranını göster
if(firstTime)openPicker();
</script>
